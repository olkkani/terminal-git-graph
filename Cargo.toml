[package]
name = "terminal-git-graph"
version = "0.1.0"
edition = "2021"
description = "A terminal git graph viewer"
license = "MIT"
repository = "https://github.com/olkkani/terminal-git-graph"

[lib]
name = "terminal_git_graph"
path = "src/lib.rs"

[[bin]]
name = "tgg"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
notify = "7"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
base64 = "0.22"
unicode-width = "0.2"
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
